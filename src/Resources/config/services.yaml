services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\BeaconBundle\Dsn\BeaconDsnParser: ~

    Nowo\BeaconBundle\Breadcrumb\BreadcrumbBuffer:
        tags:
            - { name: kernel.reset, method: reset }

    Nowo\BeaconBundle\Scope\Scope:
        tags:
            - { name: kernel.reset, method: reset }

    Nowo\BeaconBundle\Trace\TraceIdProvider:
        tags:
            - { name: kernel.reset, method: reset }

    Nowo\BeaconBundle\Instrumentation\SpanBuffer:
        tags:
            - { name: kernel.reset, method: reset }

    Nowo\BeaconBundle\Envelope\PendingTransportRegistry: ~

    # REQ-RUNTIME-002: lazy iterators of IGNORE_ON_UNINITIALIZED references ('@!'): a boundary never builds a service.
    # autoconfigure off: it implements ResetInterface, but its console bookkeeping must survive kernel.reset (1.24.1).
    Nowo\BeaconBundle\EventListener\BeaconRequestScopeResetListener:
        autowire: false
        autoconfigure: false
        arguments:
            $scopeState: !iterator
                - '@!Nowo\BeaconBundle\Breadcrumb\BreadcrumbBuffer'
                - '@!Nowo\BeaconBundle\Instrumentation\SpanBuffer'
                - '@!Nowo\BeaconBundle\Scope\Scope'
                - '@!Nowo\BeaconBundle\Trace\TraceIdProvider'
            $pendingRegistries: !iterator
                - '@!Nowo\BeaconBundle\Envelope\PendingTransportRegistry'
        tags:
            - { name: kernel.event_subscriber }

    Nowo\BeaconBundle\EventListener\BeaconExceptionListener:
        tags:
            - { name: kernel.event_subscriber }

    Nowo\BeaconBundle\EventListener\BeaconConsoleErrorListener:
        tags:
            - { name: kernel.event_subscriber }
