# CI: tests on PHP 8.2–8.5 × Symfony 7.0, 7.4, 8.0, 8.1 (exclusions for incompatible pairs).
# Coverage with PCOV; release updated via release.yml on tag push.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Light mode (docs/GITHUB_CI.md#light-mode-for-deps-and-docs-only-prs): one representative cell plus the cheap
  # gates. The org (or repo) Actions variable NOWO_CI_PR_MODE picks the PR mode: light = every PR light; full = every
  # PR full; auto / unset = light only when the PR touches nothing but composer.json / composer.lock (root or demo),
  # docs/**, *.md, .github/ISSUE_TEMPLATE/**, specs/** or .cursor/**. push, tags, workflow_dispatch and schedule are
  # always full. Fail-closed: any error, unknown value or empty output means full (jobs reduce only on 'light').
  changes:
    name: Change scope (light or full)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout code (PR merge commit and its base parent)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          SWITCH: ${{ vars.NOWO_CI_PR_MODE }}
          LIGHT: '^((demo/([^/]+/)?)?composer\.(json|lock)|docs/.*|specs/.*|\.cursor/.*|\.github/ISSUE_TEMPLATE/.*|.*\.md)$'
        run: |
          mode=full; paths=""
          if [ "$EVENT" != pull_request ]; then
            reason="event '$EVENT' always runs full"
          else
            case "$SWITCH" in
              light) mode=light; reason="NOWO_CI_PR_MODE=light: every PR is light" ;;
              full) reason="NOWO_CI_PR_MODE=full: every PR is full" ;;
              ''|auto)
                if files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
                  mode=light; reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): only deps/docs paths changed"
                  while IFS= read -r f; do
                    [ -n "$f" ] || continue
                    if ! printf '%s\n' "$f" | grep -Eq "$LIGHT"; then mode=full; paths="$paths $f"; fi
                  done <<< "$files"
                  [ "$mode" = light ] || reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): non deps/docs paths changed:$paths"
                else
                  reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): git diff failed, fail-closed"
                fi ;;
              *) reason="NOWO_CI_PR_MODE='$SWITCH' is not light/auto/full, fail-closed" ;;
            esac
          fi
          echo "mode=$mode ($reason)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### CI mode: \`$mode\`"
            echo ""
            echo "$reason"
            if [ "$EVENT" = pull_request ] && [ -n "${files:-}" ]; then echo ""; echo "Changed paths:"; echo '```'; echo "$files" | head -200; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  # REQ-SF-002: matrix must include mandatory Symfony minors 7.4, 8.0, and 8.1.
  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    needs: changes
    # Never skip this job: a skipped matrix job reports its un-expanded name and the required contexts never
    # appear. In light mode its steps are gated by HEAVY instead.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # REQ-SF-002: 7.0 and 8.0 are end of maintenance and every 7.0.x / 8.0.x release carries security advisories
        # that Composer refuses to install, so those cells are dropped (composer.json keeps allowing them).
        symfony: ['7.4', '8.1']
        exclude:
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' || (matrix.php == '8.5' && matrix.symfony == '8.1') }}
    steps:
      - name: Light mode (deps/docs-only PR) - covered by PHP 8.5 - Symfony 8.1
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout code
        uses: actions/checkout@v7
        if: env.HEAVY == 'true'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: pcov
          tools: composer:v2
        if: env.HEAVY == 'true'

      - name: Validate composer.json
        run: composer validate --strict
        if: env.HEAVY == 'true'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        if: env.HEAVY == 'true'

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-
        if: env.HEAVY == 'true'

      # Do not set platform.php to "8.4" — Composer treats it as 8.4.0, but Symfony 8.1 requires >=8.4.1.
      # Matrix already runs Symfony 8 only on PHP 8.4 / 8.5 via setup-php.

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        run: composer config platform.php "${{ matrix.php }}.99"
        if: env.HEAVY == 'true'

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        run: |
          # REQ-SF-002: pin every symfony/* package of composer.json to the cell's minor (no caret drift to 8.x).
          PACKAGES=$(jq -r --arg c '${{ matrix.symfony }}.*' '(.require + ."require-dev") | keys[] | select(startswith("symfony/")) | . + ":" + $c' composer.json)
          composer require $PACKAGES --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
        if: env.HEAVY == 'true'

      - name: Composer audit (Critical/High)
        run: composer audit --locked
        if: env.HEAVY == 'true'

      - name: Run tests
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test
        if: env.HEAVY == 'true'

      - name: Run tests with coverage (PHP 8.2 + Symfony 7.4 only)
        if: env.HEAVY == 'true' && (matrix.php == '8.2' && matrix.symfony == '7.4')
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test-coverage

  # Lowest supported nowo-tech/beacon-php (composer.json: ^0.3 since 1.27.0, which needs the final core classes).
  test-beacon-php-lowest:
    name: PHP 8.4 - Symfony 8.1 - beacon-php 0.3.0
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as success).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json
          coverage: pcov
          tools: composer:v2

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        run: composer config platform.php "8.4.99"

      - name: Install dependencies with beacon-php 0.3.0
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer update nowo-tech/beacon-php --with "nowo-tech/beacon-php:0.3.0" --with-all-dependencies --no-interaction --prefer-dist --no-progress
          composer show nowo-tech/beacon-php | grep -E '^versions'

      - name: Run tests
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test

      - name: Run PHPStan
        run: composer phpstan

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.lock tracks Symfony 8.1 (php >=8.4.1); plain composer install cannot run on 8.2.
          php-version: '8.4'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Fix code style
        run: composer cs-fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- '*.php')" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add '*.php'
          git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code style, PHPStan, Igor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.lock tracks Symfony 8.1 (php >=8.4.1); plain composer install cannot run on 8.2.
          php-version: '8.4'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check

      - name: PHPStan (REQ-CS-005 / REQ-CS-006)
        run: composer phpstan

      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor

      - name: Validate translations (REQ-MAKE-004)
        run: php .scripts/validate-translations.php

  coverage:
    name: Code Coverage
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as success).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies (Symfony 7.4)
        run: |
          PACKAGES=$(jq -r '(.require + ."require-dev") | keys[] | select(startswith("symfony/")) | . + ":7.4.*"' composer.json)
          composer require $PACKAGES --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Run tests with coverage
        run: composer test-coverage-100

      - name: Validate coverage file
        run: |
          if [ ! -f coverage.xml ]; then
            echo "ERROR: coverage.xml was not generated"
            exit 1
          fi
          echo "coverage.xml generated"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
